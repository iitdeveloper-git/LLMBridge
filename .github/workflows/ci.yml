name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npx vsce package --no-dependencies -o llm-bridge.vsix
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: llm-bridge.vsix }
